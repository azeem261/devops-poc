# Local development without Kubernetes: `docker compose up --build`
# Frontend: http://localhost:8080  |  API docs: http://localhost:8000/docs
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: taskflow
      POSTGRES_PASSWORD: taskflow
      POSTGRES_DB: taskflow
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskflow -d taskflow"]
      interval: 3s
      timeout: 3s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: apps/api
    environment:
      DATABASE_URL: postgresql+psycopg://taskflow:taskflow@postgres:5432/taskflow
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build: apps/worker
    environment:
      DATABASE_URL: postgresql+psycopg://taskflow:taskflow@postgres:5432/taskflow
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: apps/frontend
    ports:
      # 8080 belongs to the kind ingress controller now — compose uses 8081
      - "8081:80"
    depends_on:
      - api

  stats:
    build: apps/stats
    environment:
      DATABASE_URL: postgresql+psycopg://taskflow:taskflow@postgres:5432/taskflow
    depends_on:
      postgres:
        condition: service_healthy

  loadgen:
    build: apps/loadgen
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
