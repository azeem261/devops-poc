# The ArgoCD "Application" — this is the GitOps contract:
# "keep <destinationNamespace> in sync with <path> of <repoURL>".
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: taskflow
  namespace: {{ .Release.Namespace }}
spec:
  project: default
  source:
    repoURL: {{ .Values.repoURL | quote }}
    targetRevision: {{ .Values.targetRevision | quote }}
    path: {{ .Values.path | quote }}
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ .Values.destinationNamespace | quote }}
  syncPolicy:
    automated:
      prune: true      # delete cluster resources removed from git
      selfHeal: true   # revert manual kubectl edits back to git state
    syncOptions:
      - CreateNamespace=true
