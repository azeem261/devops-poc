apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: taskflow-staging

resources:
- ../../base

patches:
  # - target:
  #     kind: Service
  #     name: frontend
  #   patch: |-
  #     - op: replace
  #       path: /spec/type
  #       value: ClusterIP
  #     - op: remove
  #       path: /spec/ports/0/nodePort
  - target:
      kind: Deployment
      name: frontend
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
  - target:
      kind: Ingress
      name: taskflow
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: staging.taskflow.localtest.me

# CI rewrites newName/newTag on every build (kustomize edit set image).
# CHANGE_ME = your GitHub username (lowercase). The first CI run will
# overwrite these values automatically.
images:
- name: devops-poc-api
  newName: ghcr.io/azeem261/devops-poc-api
  newTag: 95bba40e03af1b9991ba10d75f02b1db8a5c17c1
- name: devops-poc-frontend
  newName: ghcr.io/azeem261/devops-poc-frontend
  newTag: 95bba40e03af1b9991ba10d75f02b1db8a5c17c1
- name: devops-poc-worker
  newName: ghcr.io/azeem261/devops-poc-worker
  newTag: 95bba40e03af1b9991ba10d75f02b1db8a5c17c1
- name: devops-poc-stats
  newName: ghcr.io/azeem261/devops-poc-stats
  newTag: 95bba40e03af1b9991ba10d75f02b1db8a5c17c1
