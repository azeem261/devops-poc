apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: devops-poc-frontend  # real name:tag set by kustomize overlay
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  # NodePort 30080 is mapped to localhost:8080 by the kind cluster config
  # (see infra/terraform/main.tf), so the app is reachable at
  # http://localhost:8080 on the host machine.
  type: ClusterIP
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
